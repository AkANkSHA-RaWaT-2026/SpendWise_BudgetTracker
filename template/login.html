{% extends "base.html" %}
{% block content %}
<div style="max-width:420px; margin:0 auto;">
  <div class="card">
    <h2 style="font-size:22px; font-weight:700; margin-bottom:24px; text-align:center;">Login</h2>
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" required placeholder="Enter username">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" required placeholder="Enter password">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%; padding:12px;">Login</button>
    </form>
    <p style="text-align:center; margin-top:16px; font-size:14px; color:#666;">
      No account? <a href="/register" style="color:#1a73e8;">Register here</a>
    </p>
  </div>
</div>
{% endblock %}
