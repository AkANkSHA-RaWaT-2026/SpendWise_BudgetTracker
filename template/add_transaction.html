{% extends "base.html" %}
{% block content %}
<div style="max-width:560px; margin:0 auto;">
  <div class="page-title">Add Transaction</div>
  <div class="card">
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="form-group">
        <label>Description</label>
        <input type="text" name="description" id="desc" placeholder="e.g. Jio recharge, Salary credit" autocomplete="off">
        <div style="font-size:12px; color:#888; margin-top:4px;">Type and wait — AI will predict the category</div>
      </div>

      {% if predicted_category and confidence %}
      <div class="alert alert-info" style="font-size:13px;">
        AI Prediction: <strong>{{ predicted_category }}</strong> ({{ confidence }}% confidence)
      </div>
      {% endif %}

      <div class="form-group">
        <label>Type</label>
        <select name="type" id="type" required>
          <option value="expense">Expense</option>
          <option value="income">Income</option>
        </select>
      </div>

      <div class="form-group">
        <label>Category</label>
        <select name="category" id="category" required></select>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label>Amount (₹)</label>
          <input type="number" name="amount" placeholder="e.g. 500" min="0.01" step="any" required>
        </div>
        <div class="form-group">
          <label>Date</label>
          <input type="date" name="date" value="{{ now }}">
        </div>
      </div>

      <div style="display:flex; gap:12px;">
        <button type="submit" class="btn btn-primary" style="flex:1; padding:12px;">Save Transaction</button>
        <a href="/dashboard" class="btn btn-outline" style="flex:1; padding:12px; text-align:center;">Cancel</a>
      </div>
    </form>
  </div>
</div>

<script>
const EXPENSE_CATEGORIES = [
  'Groceries','Mobile Recharge','DTH Recharge','Petrol','Transportation',
  'Utilities','Internet','Rent','EMI','Healthcare','Education','Dining',
  'Entertainment','Shopping','Festival','Other'
];
const INCOME_CATEGORIES = [
  'Salary','Freelance','Business Income','Rental Income','Interest & Returns',
  'Dividends','Bonus','Reimbursement','Other Income'
];

const predicted = "{{ predicted_category | default('') }}";

function populateCategories(type, selectValue) {
  const sel = document.getElementById('category');
  const cats = type === 'income' ? INCOME_CATEGORIES : EXPENSE_CATEGORIES;
  sel.innerHTML = '';
  cats.forEach(cat => {
    const opt = document.createElement('option');
    opt.value = cat;
    opt.textContent = cat;
    if (cat === selectValue) opt.selected = true;
    sel.appendChild(opt);
  });
}

// Init on page load
const typeEl = document.getElementById('type');
populateCategories(typeEl.value, predicted);

// Rebuild list when type changes
typeEl.addEventListener('change', function () {
  populateCategories(this.value, null);
  // Re-run prediction for current description with new type
  const desc = document.getElementById('desc').value.trim();
  if (desc.length >= 3) triggerPredict(desc);
});

// AI prediction
let timer;
function triggerPredict(desc) {
  clearTimeout(timer);
  timer = setTimeout(async () => {
    try {
      const res = await fetch('/api/predict_category', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token() }}' },
        body: JSON.stringify({ description: desc, type: typeEl.value })
      });
      const data = await res.json();
      const sel = document.getElementById('category');
      for (let o of sel.options) {
        if (o.value === data.category) { sel.value = data.category; break; }
      }
    } catch(e) {}
  }, 600);
}

document.getElementById('desc').addEventListener('input', function () {
  const desc = this.value.trim();
  if (desc.length < 3) return;
  triggerPredict(desc);
});
</script>
{% endblock %}
