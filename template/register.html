{% extends "base.html" %}
{% block content %}
<div style="max-width:420px; margin:0 auto;">
  <div class="card">
    <h2 style="font-size:22px; font-weight:700; margin-bottom:24px; text-align:center;">Create Account</h2>
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" required placeholder="Enter username">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" required placeholder="Enter email">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" required placeholder="Min 6 characters">
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" name="confirm_password" required placeholder="Repeat password">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%; padding:12px;">Register</button>
    </form>
    <p style="text-align:center; margin-top:16px; font-size:14px; color:#666;">
      Already have an account? <a href="/login" style="color:#1a73e8;">Login</a>
    </p>
  </div>
</div>
{% endblock %}
